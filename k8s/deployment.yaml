apiVersion: apps/v1
kind: Deployment

metadata:
  name: movievault-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: movievault

  template:
    metadata:
      labels:
        app: movievault

    spec:
      containers:
        - name: movievault-container
          image: sanathachari/movievault:latest

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
